# Semiconductor Physics - Intelligent Textbook
site_name: "Semiconductor Physics"
site_description: "An interactive university-level semiconductor physics textbook with AI explanations, quizzes, simulations, and practice problems."
site_author: "Natol Dinka"
site_url: "https://Nati-123.github.io/semiconductor-physics-textbook/"
repo_url: "https://github.com/Nati-123/semiconductor-physics-textbook"
repo_name: "Nati-123/semiconductor-physics-textbook"
copyright: >
  Created by Natol Dinka.
  Licensed under <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a>.

# Theme Configuration
theme:
  name: material
  font:
    text: Roboto
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - navigation.top
    - toc.integrate
    - content.tabs.link
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
  icon:
    logo: material/atom

# Markdown Extensions
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Plugins
plugins:
  - search

extra_css:
  - stylesheets/extra.css?v=1
  - stylesheets/quiz.css?v=1

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/tts-reader.js?v=1
  - javascripts/quiz-ui.js?v=1
  - javascripts/problems-ui.js?v=1
  - javascripts/diagram-wrap.js?v=1

# URI Scheme for intelligent textbook discoverability
extra:
  schema: https://dmccreary.github.io/intelligent-textbooks/ns/textbook/v1

