<svg viewBox="0 0 1000 180" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Subtle equation background -->
  <text font-family="'Courier New', monospace" font-size="10" letter-spacing="2">
    <tspan x="20" y="16" fill="rgba(0,191,255,0.05)">E = hf</tspan>
    <tspan x="540" y="16" fill="rgba(0,191,255,0.04)">psi(x,t)</tspan>
    <tspan x="30" y="172" fill="rgba(0,191,255,0.05)">n = Nc exp(-(Ec-Ef)/kT)</tspan>
    <tspan x="600" y="172" fill="rgba(0,191,255,0.04)">J = q(n*mu_n + p*mu_p)E</tspan>
  </text>

  <!-- Crystal lattice grid -->
  <g stroke="rgba(0,191,255,0.14)" stroke-width="1">
    <path d="M20,90 L60,60 L100,90 L60,120 Z"/>
    <path d="M100,90 L140,60 L180,90 L140,120 Z"/>
    <path d="M60,60 L100,30 L140,60"/>
    <path d="M60,120 L100,150 L140,120"/>
  </g>
  <g fill="rgba(0,191,255,0.35)">
    <circle cx="60" cy="60" r="3"/>
    <circle cx="100" cy="90" r="3"/>
    <circle cx="140" cy="60" r="3"/>
    <circle cx="60" cy="120" r="3"/>
    <circle cx="140" cy="120" r="3"/>
    <circle cx="100" cy="30" r="3"/>
    <circle cx="100" cy="150" r="3"/>
    <circle cx="20" cy="90" r="3"/>
    <circle cx="180" cy="90" r="3"/>
  </g>
  <text x="100" y="105" fill="rgba(0,191,255,0.3)" font-size="7" font-family="'Courier New', monospace" text-anchor="middle">Si LATTICE</text>

  <!-- Bohr atom with orbiting electron -->
  <g transform="translate(320,90)" filter="url(#glow)">
    <circle cx="0" cy="0" r="6" fill="#00BFFF" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="55" ry="22" fill="none" stroke="rgba(0,191,255,0.4)" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="55" ry="22" fill="none" stroke="rgba(0,191,255,0.25)" stroke-width="1" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="55" ry="22" fill="none" stroke="rgba(0,191,255,0.25)" stroke-width="1" transform="rotate(120)"/>
    <circle cx="55" cy="0" r="3" fill="#00BFFF" opacity="0.8"/>
    <circle cx="-27.5" cy="19" r="3" fill="#00BFFF" opacity="0.6" transform="rotate(60)"/>
  </g>
  <text x="320" y="140" fill="rgba(0,191,255,0.3)" font-size="8" font-family="'Courier New', monospace" text-anchor="middle">ATOM</text>

  <!-- Energy band diagram: conduction band, gap, valence band -->
  <g transform="translate(460,25)" opacity="0.75">
    <rect x="0" y="0" width="150" height="26" fill="rgba(0,191,255,0.05)" stroke="#00BFFF" stroke-width="1.2" filter="url(#glow)"/>
    <text x="75" y="17" fill="rgba(0,191,255,0.6)" font-size="9" font-family="'Courier New', monospace" text-anchor="middle">CONDUCTION BAND</text>
    <circle cx="40" cy="13" r="3" fill="#00BFFF"/>
    <circle cx="105" cy="13" r="3" fill="#00BFFF"/>

    <!-- band gap arrow -->
    <line x1="75" y1="30" x2="75" y2="78" stroke="rgba(0,191,255,0.45)" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="90" y="58" fill="rgba(0,191,255,0.4)" font-size="8" font-family="'Courier New', monospace">Eg</text>

    <rect x="0" y="82" width="150" height="26" fill="rgba(0,191,255,0.05)" stroke="#00BFFF" stroke-width="1.2" filter="url(#glow)"/>
    <text x="75" y="99" fill="rgba(0,191,255,0.6)" font-size="9" font-family="'Courier New', monospace" text-anchor="middle">VALENCE BAND</text>
    <circle cx="55" cy="95" r="3" fill="none" stroke="#00BFFF" stroke-width="1"/>
    <text x="55" y="98" fill="rgba(0,191,255,0.5)" font-size="6" text-anchor="middle">+</text>
  </g>

  <!-- Wavefunction squiggle -->
  <g transform="translate(680,90)" stroke="#00BFFF" stroke-width="1.2" fill="none" filter="url(#glow)" opacity="0.55">
    <path d="M0,0 C15,-30 30,30 45,0 C60,-30 75,30 90,0 C105,-30 120,30 135,0"/>
  </g>
  <text x="745" y="45" fill="rgba(0,191,255,0.3)" font-size="8" font-family="'Courier New', monospace" text-anchor="middle">psi(x)</text>

  <!-- Doping ions -->
  <g font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle">
    <circle cx="860" cy="60" r="14" fill="rgba(0,191,255,0.05)" stroke="rgba(0,191,255,0.5)" stroke-width="1.2" filter="url(#glow)"/>
    <text x="860" y="64" fill="rgba(0,191,255,0.6)">P+</text>
    <circle cx="910" cy="100" r="14" fill="rgba(0,191,255,0.05)" stroke="rgba(0,191,255,0.5)" stroke-width="1.2" filter="url(#glow)"/>
    <text x="910" y="104" fill="rgba(0,191,255,0.6)">B-</text>
    <circle cx="960" cy="60" r="14" fill="rgba(0,191,255,0.05)" stroke="rgba(0,191,255,0.5)" stroke-width="1.2" filter="url(#glow)"/>
    <text x="960" y="64" fill="rgba(0,191,255,0.6)">As+</text>
  </g>
  <text x="910" y="145" fill="rgba(0,191,255,0.25)" font-size="8" font-family="'Courier New', monospace" text-anchor="middle">DOPANTS</text>
</svg>
